[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Release gate: syntax errors, undefined names, and invalid control flow.
# Formatting/style is intentionally kept separate from correctness auditing.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
