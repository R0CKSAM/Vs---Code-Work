[pytest]
# ── Discovery ─────────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ───────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# ── Markers ──────────────────────────────────────────────────────────────────
markers =
    e2e: End-to-end Playwright tests that require a live browser.
    unit: Pure Python unit tests with no browser dependency.
    smoke: Lightweight connectivity and identity checks.
    slow: Tests that take longer than 30 seconds to run.

# ── Timeouts ─────────────────────────────────────────────────────────────────
# pytest-timeout is an optional plugin; remove if not installed.
# timeout = 120
