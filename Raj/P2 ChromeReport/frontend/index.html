<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Channel Frequency Comparison Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-quartz.css">
    <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
    <header class="app-header sticky-top">
        <div class="container-fluid px-3 px-xl-4 py-2">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h1 class="app-title mb-1">TV Channel Frequency Comparison Dashboard</h1>
                    <p class="app-subtitle mb-0">Weekly Frequency Distribution Analysis</p>
                </div>
                <div class="header-meta">
                    <div class="header-meta-card">
                        <span class="header-meta-label">Last Refresh</span>
                        <strong id="lastRefreshBadge">Awaiting data</strong>
                    </div>
                    <div class="header-meta-card">
                        <span class="header-meta-label">Total Records</span>
                        <strong id="toolbarTotalRecords">0</strong>
                    </div>
                    <a class="btn btn-outline-secondary btn-sm" id="exportCsvButton" href="#">Export CSV</a>
                    <a class="btn btn-primary btn-sm" id="exportExcelButton" href="#">Export Excel</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid px-3 px-xl-4 py-2 dashboard-shell" id="dashboardRoot">
        <section class="row g-2 mb-2">
            <div class="col-lg-4 col-md-6">
                <div class="kpi-card">
                    <div>
                        <span class="kpi-label">Total Weeks</span>
                        <strong id="summaryWeeks">0</strong>
                    </div>
                    <span class="kpi-icon">W</span>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="kpi-card">
                    <div>
                        <span class="kpi-label">Total Channels</span>
                        <strong id="summaryChannels">0</strong>
                    </div>
                    <span class="kpi-icon">C</span>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="kpi-card">
                    <div>
                        <span class="kpi-label">Total Markets</span>
                        <strong id="summaryMarkets">0</strong>
                    </div>
                    <span class="kpi-icon">M</span>
                </div>
            </div>
        </section>

        <section class="card panel-card mb-2" id="fullscreenPanel">
            <div class="card-body">
                <section class="filter-section">
                    <div class="section-heading d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                        <div>
                            <h2 class="section-title mb-0">Filter Panel</h2>
                        </div>
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                            <span class="badge text-bg-light border" id="sourceFilesBadge">Loading files...</span>
                            <button class="btn btn-outline-secondary btn-sm" id="resetFiltersButton">Reset Filters</button>
                            <button class="btn btn-primary btn-sm" id="applyFiltersButton">Apply Filters</button>
                        </div>
                    </div>
                    <div class="row g-2" id="filterPanel"></div>
                </section>

                <section class="table-section mt-2">
                    <div class="section-heading d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                        <div>
                            <h2 class="section-title mb-0">Frequency Distribution</h2>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-outline-primary btn-sm" id="refreshDataButton">Refresh Data</button>
                            <button class="btn btn-outline-secondary btn-sm" id="clearFiltersButton">Clear Filters</button>
                            <button class="btn btn-primary btn-sm" id="fullscreenButton">Full Screen</button>
                        </div>
                    </div>

                    <div id="gridStatus" class="grid-status small text-secondary mb-2">Loading data...</div>
                    <div id="frequencyGrid" class="ag-theme-quartz dashboard-grid"></div>
                </section>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/frontend/app.js"></script>
</body>
</html>
