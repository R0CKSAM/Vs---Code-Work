<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#172033;--muted:#64748b;--panel:#fff;--line:#d8e1ee;--brand:#173b5c;--brand2:#1f6f8b;--accent:#c9a227;--bg:#eef3f8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-text-size-adjust:100%}
.topbar{background:var(--brand);color:#fff;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;border-bottom:4px solid var(--accent);box-shadow:0 8px 22px rgba(15,23,42,.16)}
.title-block{display:flex;flex-direction:column;gap:3px}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:0}.topbar .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#cbd5e1;font-weight:700}.header-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;max-width:min(980px,72vw);line-height:1.35}.topbar .sub{font-size:12px;color:#dbe7f2}.range-pill{font-size:12px;font-weight:700;color:#fff}
#main{padding:22px 28px;max-width:1760px;margin:0 auto}
.sticky-controls{position:sticky;top:0;z-index:45;background:rgba(238,243,248,.96);backdrop-filter:blur(8px);padding:10px 0 2px;margin:-10px 0 16px}
.sticky-controls .meta-strip,.sticky-controls .filter-group{margin-bottom:8px}
.meta-strip{background:var(--panel);border-radius:8px;border:1px solid var(--line);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;font-size:12px;color:#475569;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.meta-items{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center}
.meta-strip b{color:var(--ink);font-weight:700}
.control-row{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.cards{display:flex;flex-direction:column;gap:14px;width:100%}
.kpi-section{min-width:0}
.kpi-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 7px}
.kpi-section-head h2{font-size:12px;font-weight:850;color:#24324a;letter-spacing:.02em;text-transform:uppercase}
.kpi-section-head span{display:none}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;width:100%}
.card{min-width:0;max-width:100%;overflow:hidden;background:var(--panel);border-radius:8px;border:1px solid var(--line);padding:11px 12px;text-align:center;transition:all 0.3s;box-shadow:0 1px 2px rgba(15,23,42,.05);border-top:3px solid currentColor}
.clbl{font-size:10.5px;color:var(--muted);margin-bottom:7px;display:flex;align-items:flex-start;justify-content:center;text-align:center;gap:6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.15;min-height:24px;overflow-wrap:anywhere}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cval{font-size:25px;font-weight:800;line-height:1.05;max-width:100%;overflow-wrap:anywhere;word-break:break-word;font-variant-numeric:tabular-nums}
.csub{font-size:10px;color:#64748b;margin-top:6px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.charts{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:16px;margin-bottom:18px}
.cbox{flex:1 1 calc((100% - 16px)/2);min-width:320px;background:var(--panel);border-radius:8px;border:1px solid var(--line);padding:15px 17px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.cbox h3{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#24324a}
.cbox canvas{width:100%!important;height:clamp(170px,22vh,240px)!important}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.chart-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chart-days{color:#94a3b8;font-weight:500;font-size:11px}
.expand-btn{border:1px solid #cbd5e1;background:#fff;color:#1F3864;border-radius:5px;padding:3px 8px;font-size:10px;font-weight:800;cursor:pointer}
.expand-btn:hover{background:#edf2f7;border-color:#94a3b8}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:22px}
.modal-backdrop.open{display:flex}
.chart-modal{width:min(1180px,96vw);height:min(760px,92vh);background:#fff;border-radius:10px;border:1px solid #d8e1ee;box-shadow:0 24px 80px rgba(15,23,42,.28);display:flex;flex-direction:column;overflow:hidden}
.modal-top{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;background:#f8fafc}
.modal-title{font-size:16px;font-weight:800;color:#1F3864}
.modal-close{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:6px;padding:5px 10px;font-weight:800;cursor:pointer}
.modal-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.modal-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-controls input[type="date"]{border:1px solid #cbd5e1;padding:5px 7px;border-radius:5px;font-size:11px;font-family:inherit;color:#1F3864;font-weight:600}
.modal-range{font-size:11px;color:#64748b;font-weight:700;margin-left:auto}
.modal-stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px}
.stat-chip{border:1px solid #e2e8f0;border-top:3px solid #1F3864;border-radius:7px;padding:8px 10px;background:#fff}
.stat-chip b{display:block;font-size:10px;color:#64748b;text-transform:uppercase;margin-bottom:3px}
.stat-chip span{font-size:16px;font-weight:800;color:#1e293b}
.modal-chart-wrap{min-height:0;flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:12px;background:#fff}
.modal-chart-wrap canvas{width:100%!important;height:100%!important}
.table-wrap{background:var(--panel);border-radius:8px;border:1px solid var(--line);overflow:hidden;margin-bottom:18px;box-shadow:0 2px 8px rgba(15,23,42,.06)}
.thead{padding:13px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:15px;background:#f8fafc}
.thead h3{font-size:14px;font-weight:700;color:#24324a}
.table-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.table-summary{font-size:11px;color:#64748b;font-weight:750;line-height:1.3}
.drop-label{display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1;font-weight:800}
.drop-label span{display:block}
.drop-select{width:100%;max-width:68px;border:1px solid #fdba74;background:#fff;color:#7c2d12;border-radius:6px;padding:3px 5px;font-size:9.5px;font-weight:800;outline:none;cursor:pointer;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.drop-select:hover{border-color:#f97316;background:#fffbeb}
.drop-select:focus{border-color:#ea580c;box-shadow:0 0 0 2px rgba(249,115,22,.18)}
.filter-group{display:flex;align-items:center;gap:8px;background:#fff;padding:11px 12px;border-radius:8px;border:1px solid var(--line);border-top:3px solid var(--accent);box-shadow:0 1px 2px rgba(15,23,42,.05);width:100%;overflow-x:auto;white-space:nowrap}
.filter-group input[type="date"],.filter-group select{border:1px solid #cbd5e1;padding:5px 6px;border-radius:4px;font-size:11px;outline:none;font-family:inherit;color:#1F3864;font-weight:700;cursor:pointer;min-width:116px;background:#fff}
.filter-group select{min-width:72px}
.filter-group span{font-size:11px;color:#64748b;font-weight:700;white-space:nowrap}
.date-end-wrap{display:inline-flex;align-items:center;gap:6px;line-height:1;vertical-align:middle}
.filter-group .to-label{display:inline-flex;align-items:center;align-self:center;font-size:11px;color:#64748b;font-weight:700;line-height:1}
.filter-sep{width:1px;height:24px;background:#d8e1ee}
.btn-preset{background:#fff;border:1px solid #cbd5e1;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;color:#555;transition:all 0.2s}
.btn-preset:hover{background:#edf2f7;color:#1F3864}
.btn-preset.active{background:#1F3864;color:#fff;border-color:#1F3864}
.tbl-c{overflow-x:auto;max-height:650px;overflow-y:auto;background:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:10px;table-layout:fixed}
thead{position:sticky;top:0;z-index:5}
thead tr:first-child th{padding:5px 5px;font-size:9px;font-weight:700;color:#fff;text-align:center;white-space:normal;border-right:1px solid rgba(255,255,255,.25);border-bottom:1px solid #b8c4d4}
thead tr:last-child th{padding:6px 4px;text-align:center;font-size:9px;font-weight:600;color:#334155;border-right:1px solid #cbd5e1;border-bottom:1px solid #b8c4d4;white-space:normal;line-height:1.15;background:#f8fafc;cursor:pointer;user-select:none;overflow-wrap:anywhere;word-break:normal}
thead tr:last-child th:hover{background:#edf2f7}
thead tr:last-child th:first-child{text-align:center}
td{padding:6px 4px;text-align:center;vertical-align:middle;border-right:1px solid #dbe3ef;border-bottom:1px solid #dbe3ef;white-space:normal;line-height:1.2;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
th:first-child,td:first-child{border-left:1px solid #dbe3ef}
td:first-child{text-align:center;font-weight:500;position:sticky;left:0;background:#fff;z-index:1;width:72px}
tr:nth-child(even) td:first-child{background:#fafafa}
tr:hover td{background:#eef4ff!important}
tr.total-row td{background:#1F3864!important;color:#fff!important;font-weight:700}
tr.drop-row td{background:#fff7ed!important;color:#7c2d12!important;font-weight:700}
tr.drop-row td:first-child{text-align:center;padding:6px 5px}
.chg-pos{color:#166534!important}.chg-neg{color:#b91c1c!important}.chg-flat{color:#57534e!important}
.pct{color:#185FA5;font-weight:500}
.footer{text-align:center;font-size:11px;color:#94a3b8;padding:8px 0 20px}
th.b{background:#1F3864} th.g{background:#2e6b10} th.m{background:#7c3aed} th.a{background:#9a6000} th.p{background:#4a41a8}
@media (max-width:1450px){#main{padding:18px 20px}.topbar{padding:16px 22px}.cards{gap:12px}.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:8px}.card{padding:10px 9px}.clbl{font-size:9.5px}.cval{font-size:21px}.csub{font-size:9.5px}.charts{gap:12px}.cbox{padding:13px 14px}.tbl-c{max-height:610px}table{font-size:9.5px}thead tr:last-child th{font-size:8.5px;padding:5px 3px}td{padding:5px 3px}}
@media (max-width:1180px){.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.cbox{flex-basis:calc((100% - 12px)/2);min-width:300px}.header-meta{max-width:100%;align-items:flex-start;text-align:left}}
@media (min-width:1500px){.cbox{flex-basis:calc((100% - 32px)/3)}.tbl-c{max-height:720px}}
@media (min-width:1900px){#main{max-width:1880px}.cbox{flex-basis:calc((100% - 64px)/5);min-width:0}.cbox canvas{height:clamp(190px,23vh,270px)!important}.tbl-c{max-height:760px}body{font-size:14px}}
@media (min-width:2200px){#main{max-width:2200px}.cbox canvas{height:clamp(220px,24vh,310px)!important}.tbl-c{max-height:880px}.chart-modal{width:min(1500px,94vw);height:min(900px,92vh)}}
@media (max-width:1050px){#main{padding:16px}.sticky-controls{max-height:58vh;overflow:auto;margin:-8px 0 14px}.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}.cbox{flex-basis:100%;min-width:0}.topbar{padding:16px 18px}.topbar h1{font-size:18px}.header-meta{align-items:flex-start;max-width:100%;text-align:left}.meta-strip{align-items:flex-start}.filter-group{width:100%;overflow-x:visible;white-space:normal;flex-wrap:wrap}.control-row{align-items:stretch}}
@media (max-width:760px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-section-head{align-items:flex-start;flex-direction:column}.kpi-section-head span{text-align:left}.cval{font-size:20px}.modal-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.modal-range{width:100%;margin-left:0}.chart-modal{height:94vh}.modal-backdrop{padding:10px}}
@media (max-width:420px){.card{padding:9px 7px}.clbl{font-size:8.8px}.cval{font-size:18px}.csub{font-size:8.8px}}
@media print{body{background:#fff}.topbar,.meta-strip,.card,.cbox,.table-wrap{box-shadow:none}.filter-group{display:none}.tbl-c{max-height:none;overflow:visible}}
html,body{max-width:100%;overflow-x:hidden}
#main,.topbar,.sticky-controls,.meta-strip,.filter-group,.cards,.cbox,.table-wrap,.tbl-c,.chart-modal,.modal-body,.modal-chart-wrap{max-width:100%;min-width:0}
.filter-group{overflow-x:visible!important;white-space:normal!important;flex-wrap:wrap!important}
.tbl-c,.table-wrap{overflow-x:hidden!important;overflow-y:auto}
table{min-width:0!important;max-width:100%;table-layout:fixed}
th,td{white-space:normal!important;overflow-wrap:anywhere;word-break:break-word}
td:first-child{position:static}
</style>
</head>
<body>
<div class="topbar">
  <div class="title-block">
    <h1>Overview Dashboard Veto</h1>
  </div>
  <div class="header-meta">
    <span class="range-pill" id="rangeLbl"></span>
    <span class="sub" id="genLbl"></span>
  </div>
</div>
<div id="main">
  <div class="sticky-controls">
    <div class="meta-strip" id="metaWrap">
      <div class="meta-items" id="metaStrip"></div>
    </div>
    <div class="filter-group">
       <span>Source</span>
       <button class="btn-preset" id="srcAll" onclick="setSourceFilter('all')">ALL</button>
       <button class="btn-preset active" id="srcStream" onclick="setSourceFilter('stream')">STREAM</button>
       <button class="btn-preset" id="srcFast" onclick="setSourceFilter('fast')">FAST</button>
       <span class="filter-sep"></span>
       <button class="btn-preset" id="btnAll" onclick="setPreset('all')">ALL</button>
       <button class="btn-preset" id="btn30" onclick="setPreset(30)">30D</button>
       <button class="btn-preset active" id="btn7" onclick="setPreset(7)">7D</button>
       <button class="btn-preset" id="btnYesterday" onclick="setPreset(1)">Yesterday</button>
       <span class="filter-sep"></span>
       <span>Date Mode</span>
       <button class="btn-preset" id="dateModeSingle" onclick="setDateMode('single')">Single Date</button>
       <button class="btn-preset active" id="dateModeRange" onclick="setDateMode('range')">Date Range</button>
       <span class="filter-sep"></span>
       <input type="date" id="dateStart" onchange="handleCustomDate()" />
       <span id="dateEndWrap" class="date-end-wrap"><span class="to-label">to</span>
       <input type="date" id="dateEnd" onchange="handleCustomDate()" /></span>
       <span class="filter-sep"></span>
       <span>DAU/WAU/MAU End</span>
       <input type="date" id="activeEndDate" onchange="setActiveEndDate(this.value)" />
       <button class="btn-preset" id="activeEndSyncBtn" onclick="syncActiveEndToRange()">Range End</button>
    </div>
  </div>
  <div class="control-row">
    <div class="cards" id="cards"></div>
  </div>

  <div class="charts">
    <div class="cbox"><h3><span>Daily Row Volume</span><span class="chart-actions"><span class="chart-days" id="cH1"></span><button class="expand-btn" onclick="openChartModal('cRows')">Expand</button></span></h3><canvas id="cRows" height="170"></canvas></div>

// Sync a chart's data without triggering individual updates
function syncChartData(ch, rowsForChart, keys, update = true) {
  const len = rowsForChart.length || 1;
  ch.data.labels = rowsForChart.map(r => fmtDateShort(r.date));
  keys.forEach((k, i) => {
    const total = rowsForChart.reduce((s, r) => s + Number(r[k] || 0), 0);
    ch.data.datasets[i * 2].data = rowsForChart.map(r => r[k]);
    ch.data.datasets[(i * 2) + 1].data = Array(len).fill(total / len);
  });
  if (update) ch.update('none'); // 'none' skips animation for filter-driven updates
}

function updateCharts() {
  if (!chartInstances['cRows']) return;
  // Sync all charts without individual updates, then batch-update
  Object.entries(chartDefs).forEach(([id, def]) => syncChartData(chartInstances[id], viewRows, def.keys, false));
  Object.values(chartInstances).forEach(ch => ch.update('none'));
  document.querySelectorAll('.chart-days').forEach(e => e.textContent = viewRows.length + ' days');
}

function columnGradient(k, v, stats) {
  const n = Number(v);
  const s = stats[k];
  const group = columnGroups[fieldGroup[k]];
  if (!group || !s || isNaN(n)) return '';
  if (s.max === s.min) return ` style="background:rgba(${group.color},.08)"`;
  const t = Math.max(0, Math.min(1, (n - s.min) / (s.max - s.min)));
  const alpha = (.08 + t * .30).toFixed(3);
  return ` style="background:rgba(${group.color},${alpha})"`;
}

function dataCell(d, k, body, cls = '', stats = null) {
  return `<td${cls ? ` class="${cls}"` : ''}${stats ? columnGradient(k, d[k], stats) : ''}>${body}</td>`;
}

function fmtChg(n) {
  if (n == null || isNaN(n)) return '—';
  const cls = n > 0 ? 'chg-pos' : n < 0 ? 'chg-neg' : 'chg-flat';
  return `<span class="${cls}">${n > 0 ? '+' : ''}${(n * 100).toFixed(2)}%</span>`;
}

function excelEscape(value) {
  const text = value == null ? '' : String(value);
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function excelText(value) {
  const text = value == null ? '' : String(value);
  return /^[=+\-@]/.test(text) ? `'${text}` : text;
}

function excelNumber(value, digits = null) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '';
  return digits == null ? String(n) : n.toFixed(digits);
}

function selectedTableRangeText() {
  if (!viewRows.length) return 'No selected dates';
  const sorted = [...viewRows].sort((a, b) => a.ts - b.ts);
  const first = fmtDateShort(sorted[0].date);
  const last = fmtDateShort(sorted[sorted.length - 1].date);
  return first === last ? first : `${first} to ${last}`;
}

function dayTableTotals() {
  const tKeys = ['bytes','rows','ip_rows','dist_ip','dist_ipua','dist_dev','dist_sess','dist_ip_r2','dist_ipua_r2','sess_avail','sess_na','sess_none'];
  const totals = {};
  tKeys.forEach(k => totals[k] = viewRows.reduce((sum, r) => sum + Number(r[k] || 0), 0));
  totals.pct_ip = totals.ip_rows > 0 ? totals.dist_ip / totals.ip_rows : 0;
  totals.pct_ipua = totals.ip_rows > 0 ? totals.dist_ipua / totals.ip_rows : 0;
  totals.pct_sess = totals.ip_rows > 0 ? totals.sess_avail / totals.ip_rows : 0;
  totals.pct_sessna = totals.ip_rows > 0 ? totals.sess_na / totals.ip_rows : 0;
  totals.pct_none = totals.ip_rows > 0 ? totals.sess_none / totals.ip_rows : 0;
  return totals;
}

function xmlCell(value, type = 'String', style = 'sText', formula = '', mergeAcross = 0) {
  const attrs = [
    style ? `ss:StyleID="${style}"` : '',
    formula ? `ss:Formula="${formula}"` : '',
    mergeAcross ? `ss:MergeAcross="${mergeAcross}"` : '',
  ].filter(Boolean).join(' ');
  const dataType = type === 'Number' ? 'Number' : 'String';
  return `<Cell ${attrs}><Data ss:Type="${dataType}">${excelEscape(value)}</Data></Cell>`;
}

function xmlRow(cells, attrs = '') {
  return `<Row${attrs ? ` ${attrs}` : ''}>${cells.join('')}</Row>`;
}

function excelRawValue(row, field) {
  if (field === 'date') return fmtDateShort(row.date);
  if (field === 'bytes') return Number(row.bytes || 0);
  if (field.startsWith('pct_')) return Number(row[field] || 0);
  return Number(row[field] || 0);
}

  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function getDropGain() {
  const byDate = [...viewRows].sort((a, b) => a.ts - b.ts);
  if (!byDate.length) return {};
  const target = byDate[byDate.length - 1];
  const historyRows = completeRows.filter(r => r.ts < target.ts).sort((a, b) => a.ts - b.ts);
  if (historyRows.length < dropLookbackDays) return {};
  const baseRows = historyRows.slice(-dropLookbackDays);
  const calc = k => {
    const avg = baseRows.reduce((s, r) => s + Number(r[k] || 0), 0) / baseRows.length;
    return avg ? Number(target[k] || 0) / avg - 1 : null;
  };
  return {
    bytes: calc('bytes'), rows: calc('rows'), ip_rows: calc('ip_rows'),
    dist_ip: calc('dist_ip'), dist_ipua: calc('dist_ipua'),
    dist_dev: calc('dist_dev'), dist_sess: calc('dist_sess'),
    dist_ip_r2: calc('dist_ip_r2'), dist_ipua_r2: calc('dist_ipua_r2'),
    sess_avail: calc('sess_avail'), sess_na: calc('sess_na'), sess_none: calc('sess_none'),
    pct_sess: calc('pct_sess'), pct_sessna: calc('pct_sessna'), pct_none: calc('pct_none'),
  };
}

function renderTable() {
  const scaleStats = getScaleStats(); // uses cache
  const dropOptions = [3,5,7,14,30].map(n =>
    `<option value="${n}"${n === dropLookbackDays ? ' selected' : ''}>${n} days</option>`
  ).join('');
  const tableRows = getVisibleTableRows();

  const parts = [
    `<thead><tr>`,
    `<th class="b" style="background:#f8fafc;"></th>`,
    `<th colspan="3" class="b">General Volumes</th>`,
    `<th colspan="4" class="g">Absolute Counts</th>`,
    `<th colspan="2" class="m">Unique Subsets</th>`,
    `<th colspan="3" class="a">Session Identifiers</th>`,
    `<th colspan="5" class="p">% Data of TOTAL Segment</th>`,
    `</tr><tr>`,
    ...subH.map((title, idx) =>
      `<th onclick="handleSort('${fields[idx]}')">${title}${sortKey === fields[idx] ? (sortAsc ? ' ▲' : ' ▼') : ''}</th>`
    ),
    `</tr></thead><tbody>`,
    ...tableRows.map(d => [
      `<tr>`,
      `<td>${fmtDateShort(d.date)}</td>`,
      dataCell(d,'bytes',   fmtData(d.bytes),  '',    scaleStats),
      dataCell(d,'rows',    fmt(d.rows),        '',    scaleStats),
      dataCell(d,'ip_rows', fmt(d.ip_rows),     '',    scaleStats),
      dataCell(d,'dist_ip',    fmt(d.dist_ip),    '', scaleStats),
      dataCell(d,'dist_ipua',  fmt(d.dist_ipua),  '', scaleStats),
      dataCell(d,'dist_dev',   fmt(d.dist_dev),   '', scaleStats),
      dataCell(d,'dist_sess',  fmt(d.dist_sess),  '', scaleStats),
      dataCell(d,'dist_ip_r2',   fmt(d.dist_ip_r2),   '', scaleStats),
      dataCell(d,'dist_ipua_r2', fmt(d.dist_ipua_r2), '', scaleStats),
      dataCell(d,'sess_avail', fmt(d.sess_avail), '', scaleStats),
      dataCell(d,'sess_na',    fmt(d.sess_na),    '', scaleStats),
      dataCell(d,'sess_none',  fmt(d.sess_none),  '', scaleStats),
      dataCell(d,'pct_ip',    fmtP(d.pct_ip),    'pct', scaleStats),
      dataCell(d,'pct_ipua',  fmtP(d.pct_ipua),  'pct', scaleStats),
      dataCell(d,'pct_sess',  fmtP(d.pct_sess),  'pct', scaleStats),
      dataCell(d,'pct_sessna',fmtP(d.pct_sessna),'pct', scaleStats),
      dataCell(d,'pct_none',  fmtP(d.pct_none),  'pct', scaleStats),
      `</tr>`,
    ].join('')),
  ];

  const tKeys = ['bytes','rows','ip_rows','dist_ip','dist_ipua','dist_dev','dist_sess','dist_ip_r2','dist_ipua_r2','sess_avail','sess_na','sess_none'];
  const tVals = {};
  tKeys.forEach(k => tVals[k] = viewRows.reduce((sum, r) => sum + r[k], 0));
  const tPct = {
    pct_ip:    tVals.ip_rows > 0 ? tVals.dist_ip   / tVals.ip_rows : 0,
    pct_ipua:  tVals.ip_rows > 0 ? tVals.dist_ipua / tVals.ip_rows : 0,
    pct_sess:  tVals.ip_rows > 0 ? tVals.sess_avail / tVals.ip_rows : 0,
    pct_sessna:tVals.ip_rows > 0 ? tVals.sess_na   / tVals.ip_rows : 0,
    pct_none:  tVals.ip_rows > 0 ? tVals.sess_none / tVals.ip_rows : 0,
  };
  const dropGain = getDropGain();

  parts.push(
    `<tr class="total-row"><td>TOTAL</td>`,
    `<td>${fmtData(tVals.bytes)}</td><td>${fmt(tVals.rows)}</td><td>${fmt(tVals.ip_rows)}</td>`,
    `<td>${fmt(tVals.dist_ip)}</td><td>${fmt(tVals.dist_ipua)}</td><td>${fmt(tVals.dist_dev)}</td><td>${fmt(tVals.dist_sess)}</td>`,
    `<td>${fmt(tVals.dist_ip_r2)}</td><td>${fmt(tVals.dist_ipua_r2)}</td>`,
    `<td>${fmt(tVals.sess_avail)}</td><td>${fmt(tVals.sess_na)}</td><td>${fmt(tVals.sess_none)}</td>`,
    `<td class="pct">${fmtP(tPct.pct_ip)}</td><td class="pct">${fmtP(tPct.pct_ipua)}</td>`,
    `<td class="pct">${fmtP(tPct.pct_sess)}</td><td class="pct">${fmtP(tPct.pct_sessna)}</td><td class="pct">${fmtP(tPct.pct_none)}</td></tr>`,
    `<tr class="drop-row">`,
    `<td><div class="drop-label"><span>% Drop/Gain</span><span>vs previous</span>`,
    `<select class="drop-select" onchange="setDropLookback(this.value)">${dropOptions}</select></div></td>`,
    `<td>${fmtChg(dropGain.bytes)}</td><td>${fmtChg(dropGain.rows)}</td><td>${fmtChg(dropGain.ip_rows)}</td>`,
    `<td>${fmtChg(dropGain.dist_ip)}</td><td>${fmtChg(dropGain.dist_ipua)}</td><td>${fmtChg(dropGain.dist_dev)}</td><td>${fmtChg(dropGain.dist_sess)}</td>`,
    `<td>${fmtChg(dropGain.dist_ip_r2)}</td><td>${fmtChg(dropGain.dist_ipua_r2)}</td>`,
    `<td>${fmtChg(dropGain.sess_avail)}</td><td>${fmtChg(dropGain.sess_na)}</td><td>${fmtChg(dropGain.sess_none)}</td>`,
    `<td>—</td><td>—</td>`,
    `<td>${fmtChg(dropGain.pct_sess)}</td><td>${fmtChg(dropGain.pct_sessna)}</td><td>${fmtChg(dropGain.pct_none)}</td>`,
    `</tr></tbody>`
  );

  document.getElementById('tbl').innerHTML = parts.join('');
  updateTableControls();
}

function setDropLookback(days) {
  dropLookbackDays = Math.max(1, Number(days) || 5);
  renderTable();
}

function getVisibleTableRows() {
  if (tableExpanded || viewRows.length <= TABLE_PREVIEW_ROWS) return viewRows;
  return sortKey ? viewRows.slice(0, TABLE_PREVIEW_ROWS) : viewRows.slice(-TABLE_PREVIEW_ROWS);
}

function updateTableControls() {
  const textEl = document.getElementById('tablePreviewText');
  const btn = document.getElementById('tableToggleBtn');
  const wrap = document.getElementById('dayTableWrap');
  const total = viewRows.length;
  if (wrap) wrap.classList.toggle('preview', !tableExpanded && total > TABLE_PREVIEW_ROWS);
  if (!textEl || !btn) return;
  if (total <= TABLE_PREVIEW_ROWS) {
    textEl.textContent = total ? `Showing all ${total} day${total === 1 ? '' : 's'}` : 'No days in selected range';
    btn.style.display = 'none';
    return;
  }
  btn.style.display = '';
  btn.textContent = tableExpanded ? 'Collapse' : 'Expand';
  textEl.textContent = tableExpanded
    ? `Showing all ${total} days`
    : `Preview: ${TABLE_PREVIEW_ROWS} of ${total} days. Totals cover full selected range.`;
}

function toggleDayTable() {
  tableExpanded = !tableExpanded;
  renderTable();
}

// ── Sorting ───────────────────────────────────────────────────────────────────
function handleSort(key) {
  sortKey === key ? sortAsc = !sortAsc : (sortKey = key, sortAsc = true);
  tableExpanded = false;
  executeSortLogic();
  renderTable();
}

function executeSortLogic() {
  viewRows.sort((a, b) => {
    if (sortKey === 'date') return sortAsc ? a.ts - b.ts : b.ts - a.ts;
    const va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });
}

// ── Preset / custom date filter ───────────────────────────────────────────────
function syncUIState(presetMode) {
  ['btnAll','btn30','btn7','btnYesterday'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('active'); });
  if (presetMode === 'all') document.getElementById('btnAll').classList.add('active');
  else if (presetMode === 30) document.getElementById('btn30').classList.add('active');
  else if (presetMode === 7)  document.getElementById('btn7').classList.add('active');
  else if (presetMode === 1)  document.getElementById('btnYesterday').classList.add('active');
}

function syncPresetFromDateInputs() {
  const start = document.getElementById('dateStart')?.value || '';
  const end = document.getElementById('dateEnd')?.value || '';
  const first = completeRows[0]?.date || '';
  const last = completeRows[completeRows.length - 1]?.date || '';
  if (!start && !end) { syncUIState('all'); return; }
  if (start === first && end === last) { syncUIState('all'); return; }
  const last7 = completeRows.slice(-7);
  const last30 = completeRows.slice(-30);
  if (last && start === last && end === last) { syncUIState(1); return; }
  if (last7.length && start === tsToDateStr(last7[0].ts) && end === tsToDateStr(last7[last7.length - 1].ts)) { syncUIState(7); return; }
  if (last30.length && start === tsToDateStr(last30[0].ts) && end === tsToDateStr(last30[last30.length - 1].ts)) { syncUIState(30); return; }
  syncUIState(null);
}

function setActiveSource() {
  [['srcAll','all'],['srcStream','stream'],['srcFast','fast']].forEach(([id, value]) => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active', sourceFilter === value);
  });
}

function syncDateInputBounds() {
  const startEl = document.getElementById('dateStart');
  const endEl = document.getElementById('dateEnd');
  const first = completeRows[0]?.date || '';
  const last = completeRows[completeRows.length - 1]?.date || '';
  if (startEl) { startEl.min = first; startEl.max = last; }
  if (endEl) { endEl.min = first; endEl.max = last; }
}

function syncDateModeControls() {
  const single = dateMode === 'single';
  document.getElementById('dateModeSingle')?.classList.toggle('active', single);
  document.getElementById('dateModeRange')?.classList.toggle('active', !single);
  const wrap = document.getElementById('dateEndWrap');
  if (wrap) wrap.style.display = single ? 'none' : 'inline-flex';
  if (single) {
    const start = document.getElementById('dateStart')?.value || '';
    const end = document.getElementById('dateEnd');
    if (end) end.value = start;
  }
}

function setDateMode(mode) {
  dateMode = mode === 'range' ? 'range' : 'single';
  syncDateModeControls();
  handleCustomDate();
}

function clampDateValue(value, first, last) {
  if (!value || !first || !last) return value || '';
  if (value < first) return first;
  if (value > last) return last;
  return value;
}

function setSourceFilter(value) {
  const startEl = document.getElementById('dateStart');
  const endEl = document.getElementById('dateEnd');
  const previousStart = startEl?.value || '';
  const previousEnd = endEl?.value || '';
  sourceFilter = value || 'all';
  setActiveSource();
  completeRows = completeRowsForSource(sourceFilter);
  syncDateInputBounds();
  const first = completeRows[0]?.date || '';
  const last = completeRows[completeRows.length - 1]?.date || '';
  if (previousStart || previousEnd) {
    let nextStart = clampDateValue(previousStart || first, first, last);
    let nextEnd = clampDateValue(previousEnd || last, first, last);
    if (nextStart > nextEnd) {
      if (previousStart > last) nextEnd = nextStart;
      else nextStart = nextEnd;
    }
    if (dateMode === 'single') nextEnd = nextStart;
    if (startEl) startEl.value = nextStart;
    if (endEl) endEl.value = nextEnd;
    _applyCustomDate();
    syncPresetFromDateInputs();
  } else {
    applyViewRows([...completeRows]);
    syncPresetFromDateInputs();
  }
  if (modalChartId) setModalPreset('dashboard');
}

function applyViewRows(rows) {
  viewRows = rows;
  tableExpanded = false;
  invalidateCache();
  if (sortKey) executeSortLogic();
  renderHeader();
  renderTable();
  updateCharts();
  updateKPIs();
}

function setPreset(days) {
  syncDateInputBounds();
  dateMode = days === 1 ? 'single' : 'range';
  syncUIState(days);
  let next;
  if (days === 'all' || completeRows.length === 0) {
    next = [...completeRows];
    document.getElementById('dateStart').value = '';
    document.getElementById('dateEnd').value   = '';
  } else {
    next = completeRows.slice(-days);
    if (next.length) {
      document.getElementById('dateStart').value = tsToDateStr(next[0].ts);
      document.getElementById('dateEnd').value   = tsToDateStr(next[next.length - 1].ts);
    }
  }
  syncDateModeControls();
  applyViewRows(next);
}

// Debounced custom date handler — prevents re-render on every keypress
let _dateDebounce = null;
function handleCustomDate() {
  clearTimeout(_dateDebounce);
  _dateDebounce = setTimeout(_applyCustomDate, 200);
}

function _applyCustomDate() {
  syncUIState(null);
  const startStr = document.getElementById('dateStart').value;
  const endStr   = dateMode === 'single' ? startStr : document.getElementById('dateEnd').value;
  if (dateMode === 'single') document.getElementById('dateEnd').value = startStr;
  let sTs = -Infinity, eTs = Infinity;
  if (startStr) { const [y,m,d] = startStr.split('-').map(Number); sTs = new Date(y, m-1, d).getTime(); }
  if (endStr)   { const [y,m,d] = endStr.split('-').map(Number);   eTs = new Date(y, m-1, d+1).getTime() - 1; }
  applyViewRows(completeRows.filter(r => r.ts >= sTs && r.ts <= eTs));
}

// ── Expanded chart modal ──────────────────────────────────────────────────────
let modalChart = null;
let modalChartId = null;
let modalRows = [];

function formatMetric(k, v) {
  if (k === 'bytes')        return fmtData(v);
  if (k.startsWith('pct_')) return fmtP(v);
  return fmt(Math.round(v));
}

function openChartModal(id) {
  if (typeof Chart === 'undefined') return;
  modalChartId = id;
  const def = chartDefs[id];
  document.getElementById('modalTitle').textContent = def.title;
  document.getElementById('chartModal').classList.add('open');
  if (modalChart) modalChart.destroy();
  modalChart = new Chart(document.getElementById('modalChart'), {
    type: 'line',
    data: {labels: [], datasets: def.datasets.map(d => ({...d, data: []}))},
    options: mkOpt(def.yfmt, true),
  });
  setModalPreset('dashboard');
}

function closeChartModal() {
  document.getElementById('chartModal').classList.remove('open');
  if (modalChart) { modalChart.destroy(); modalChart = null; }
  modalChartId = null;
}

document.getElementById('chartModal').addEventListener('click', e => {
  if (e.target.id === 'chartModal') closeChartModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('chartModal').classList.contains('open'))
    closeChartModal();
});

function setModalPreset(mode) {
  if (!modalChartId) return;
  if (mode === 'dashboard') modalRows = [...viewRows].sort((a, b) => a.ts - b.ts);
  else if (mode === 'all')  modalRows = [...completeRows];
  else                      modalRows = completeRows.slice(-Number(mode));
  document.getElementById('modalStart').value = modalRows.length ? modalRows[0].date : '';
  document.getElementById('modalEnd').value   = modalRows.length ? modalRows[modalRows.length - 1].date : '';
  renderModalChart();
}

function setModalCustom() {
  if (!modalChartId) return;
  const startStr = document.getElementById('modalStart').value;
  const endStr   = document.getElementById('modalEnd').value;
  let sTs = -Infinity, eTs = Infinity;
  if (startStr) { const [y,m,d] = startStr.split('-').map(Number); sTs = new Date(y, m-1, d).getTime(); }
  if (endStr)   { const [y,m,d] = endStr.split('-').map(Number);   eTs = new Date(y, m-1, d+1).getTime() - 1; }
  modalRows = completeRows.filter(r => r.ts >= sTs && r.ts <= eTs);
  renderModalChart();
}

function renderModalChart() {
  const def = chartDefs[modalChartId];
  syncChartData(modalChart, modalRows, def.keys, true);
  document.getElementById('modalRange').textContent = modalRows.length
    ? `${fmtDateShort(modalRows[0].date)} to ${fmtDateShort(modalRows[modalRows.length - 1].date)} | ${modalRows.length} days`
    : 'No dates selected';
  const chips = [];
  def.keys.forEach(k => {
    const vals = modalRows.map(r => Number(r[k] || 0)).filter(v => !isNaN(v));
    if (!vals.length) return;
    const dsIdx = def.keys.indexOf(k) * 2;
    chips.push(
      {l: def.datasets[dsIdx].label + ' Latest', v: formatMetric(k, vals[vals.length - 1])},
      {l: def.datasets[dsIdx].label + ' Avg',    v: formatMetric(k, vals.reduce((s,v) => s+v,0) / vals.length)},
    );
  });
  document.getElementById('modalStats').innerHTML = chips.slice(0, 4)
    .map(c => `<div class="stat-chip"><b>${c.l}</b><span>${c.v}</span></div>`).join('');
}

// ── Init ──────────────────────────────────────────────────────────────────────
initCharts();
setActiveSource();
setPreset(7);
</script>
