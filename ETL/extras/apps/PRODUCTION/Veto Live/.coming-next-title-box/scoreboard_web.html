<style>

.project-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}.project-bar input{width:180px;min-width:0;height:34px;padding:5px}.project-bar select{width:280px;max-width:100%;height:34px}.project-bar .status{overflow-wrap:anywhere}.app{height:calc(100vh - 110px)}fieldset.editor-fields{border:0;margin:0;padding:0;min-width:0}dialog{min-width:0;width:min(560px,94vw);max-height:90vh;overflow:auto}.dialog-actions{flex-wrap:wrap}@media(max-width:900px){.app{height:auto}.project-bar input,.project-bar select{flex:1 1 170px}}

<style>
.toolbar{height:66px;gap:10px}.brand{font-size:17px}.nav-field{display:flex;flex-direction:column;gap:3px;min-width:0}.nav-field>span{font-size:11px;color:var(--muted);font-weight:600}.toolbar .project-choice{width:240px}.nav-field select{width:100%;min-width:0;padding:0 8px;border:1px solid #aebbc4;background:#fff;height:34px}.project-bar{display:grid;grid-template-columns:190px 130px 150px minmax(180px,1fr) 150px 34px 64px 64px;align-items:end;padding:8px 14px;gap:8px}.project-bar input{width:100%}.app{height:calc(100vh - 132px);grid-template-columns:minmax(340px,31%) 1fr}.operator-menu{position:relative}.operator-menu>summary{cursor:pointer;padding:8px;border:1px solid var(--line);list-style:none}.menu-items{position:absolute;right:0;top:40px;z-index:30;width:220px;padding:10px;background:white;border:1px solid var(--line);box-shadow:0 5px 20px #0002;display:grid;gap:6px}.menu-items .operator-name{width:100%}.preview-head{height:42px;gap:8px}.preview-head>span{overflow-wrap:anywhere}.preview-head button{width:32px;padding:0;font-size:19px}.editor-detail{margin-bottom:10px;border-top:1px solid var(--line)}.editor-detail>summary{padding:10px 0;font-weight:600;cursor:pointer}.operator-menu[open] .menu-items button{text-align:left}#presetError{color:var(--danger);margin-top:8px}.group{border:0;border-bottom:1px solid var(--line)}.group>h2{background:transparent}.preview-tools{margin-top:4px}

@media(max-width:900px){.toolbar{display:flex;flex-wrap:wrap;height:auto;position:static}.toolbar .brand{width:auto}.toolbar .project-choice{flex:1 1 190px}.toolbar button{width:auto}.toolbar .status{max-width:160px}.project-bar{grid-template-columns:repeat(3,minmax(0,1fr))}.project-bar .preset-choice{grid-column:1/3}.project-bar #presetSearch{grid-column:1/3;grid-row:auto}.project-bar input,.project-bar select{width:100%}.app{height:auto;grid-template-columns:minmax(0,1fr)}.menu-items{right:0}.preview-head{height:auto;min-height:42px}.preview-head>div{flex-shrink:0}.preview-head #dimensions{display:none}}

<style>
.operator-name{width:130px;height:34px;border:1px solid #aebbc4;padding:0 8px;font:inherit}
.users-table-wrap{max-height:360px;overflow:auto;margin-top:10px;border:1px solid var(--line)}
.users-table{width:100%;border-collapse:collapse;min-width:560px}
.users-table th,.users-table td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.users-table th{position:sticky;top:0;background:var(--surface2);font-size:12px}
.users-table select{height:30px;min-width:110px;border:1px solid #aebbc4;background:#fff}
.preview-tools{min-height:42px;display:grid;grid-template-columns:minmax(130px,190px) repeat(5,34px) minmax(90px,1fr) 34px 48px;gap:5px;align-items:center;padding:4px 0 7px}
.preview-tools select{height:34px;min-width:0;border:1px solid #aebbc4;background:#fff;padding:0 7px}
.preview-tools input[type=range]{width:100%;min-width:70px}
.tool-button{width:34px;padding:0;font-size:17px}
.stage{position:relative;touch-action:none}
.stage.drop-ready{outline:3px solid #38a169;outline-offset:-6px}
.stage.drop-ready::after{content:"Drop image";position:absolute;inset:16px;display:flex;align-items:center;justify-content:center;background:#0b1722dd;color:#fff;border:2px dashed #63d98c;font-size:22px;font-weight:700;z-index:3;pointer-events:none}
@media(max-width:1100px) and (min-width:901px){.preview-tools{grid-template-columns:minmax(110px,1fr) repeat(7,34px) 42px}.toolbar{gap:5px;padding-left:8px;padding-right:8px}.toolbar button{padding-left:7px;padding-right:7px}.brand{font-size:17px}.operator-name{width:105px}.toolbar select{width:145px}}
@media(max-width:900px){.toolbar .operator-name{width:100%;min-width:0}.users-table-wrap{max-width:calc(100vw - 54px)}.preview-tools{grid-template-columns:minmax(120px,1fr) repeat(5,34px) minmax(70px,1fr) 34px 44px}}
@media(max-width:560px){.preview-tools{grid-template-columns:minmax(0,1fr) repeat(7,34px) 42px}.preview-tools input[type=range]{grid-column:1/-2;grid-row:2}.preview-tools #previewScaleValue{grid-column:-2/-1;grid-row:2}}
</style>

<style>@media(max-width:520px){.project-bar>.nav-field:first-child{grid-column:1/-1}}</style>
<style>
.template-picker{position:relative;min-width:200px}.template-picker summary{padding:8px 12px;border:1px solid var(--line);cursor:pointer;list-style:none}.template-popup{position:absolute;top:40px;left:0;z-index:40;background:white;border:1px solid var(--line);width:280px;max-width:85vw;padding:8px}.template-popup input{width:100%;height:34px;padding:6px}.template-popup #templateOptions{max-height:260px;overflow-y:auto;margin-top:6px;display:grid;gap:3px}.template-popup button{text-align:left;height:auto;min-height:34px;white-space:normal}.template-popup button[aria-pressed=true]{background:#deefe5}.library-bar{display:flex;gap:10px;align-items:end;padding:8px 14px;background:white;border-bottom:1px solid var(--line)}.library-bar .nav-field{width:220px}.library-bar .nav-field:nth-child(2){width:320px}.signal-red{background:#a83036;color:white;border-color:#a83036}.signal-yellow{background:#ffdc66;color:#352900;border-color:#d5aa27}.signal-green{background:#18794e;color:white;border-color:#18794e}.toolbar .signal-green:hover{background:#12603e}.toolbar .signal-red:hover{background:#89282c}.toolbar .signal-yellow:hover{background:#f8cc3d}#viewDuplicate[hidden]{display:none}.app{height:calc(100vh - 132px)}
@media(max-width:1100px){.toolbar{height:auto;flex-wrap:wrap}.app{height:auto;min-height:calc(100vh - 150px)}.preview-pane{min-height:65vh}}
@media(max-width:600px){.template-picker{flex:1}.library-bar{flex-wrap:wrap}.library-bar .nav-field,.library-bar .nav-field:nth-child(2){width:calc(50% - 5px)}.toolbar .brand{width:100%}.toolbar .spacer{display:none}.app{height:auto}.preview-pane{min-height:360px}}
</style>
<style>.template-picker summary{list-style:disclosure-closed inside}.template-picker[open] summary{list-style:disclosure-open inside}</style>
<style>
.preset-picker{position:relative;min-width:0;width:100%}.preset-picker summary{height:34px;padding:7px 9px;border:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;list-style:disclosure-closed inside}.preset-picker[open] summary{list-style:disclosure-open inside}.preset-picker .template-popup{width:100%;min-width:0;max-width:100%;top:38px}.picker-options{display:grid;gap:3px;max-height:min(260px,50vh);overflow:auto;margin-top:6px;overscroll-behavior:contain}.picker-options button{width:100%;min-width:0;overflow-wrap:anywhere;padding:7px;text-align:left}.preset-picker[aria-disabled=true]{opacity:.55;pointer-events:none}.header-library select[hidden]{display:none!important}.template-popup{box-shadow:0 5px 16px #0002}.template-popup button{overflow-wrap:anywhere}.picker-empty{padding:8px;color:var(--muted)}
@media(max-width:600px){.preset-picker .template-popup{position:fixed;left:8px;right:8px;top:auto;width:auto;max-width:none;margin-top:4px}.preview-tools{grid-template-columns:repeat(5,minmax(0,1fr))!important}.preview-tools select{grid-column:1/-1}.preview-tools input[type=range]{grid-column:1/4;grid-row:auto}.preview-tools #previewScaleValue{grid-column:auto;grid-row:auto}.preview-tools .tool-button{width:100%}}

<body>
<header class="toolbar">
 <div class="header-library" role="group" aria-label="Template and saved presets">
  <div class="brand">Scoreboard Maker</div>
  <details id="templatePicker" class="template-picker"><summary id="templateLabel">Template</summary>
    <div class="template-popup"><input id="templateSearch" type="search" placeholder="Search templates" aria-label="Search templates"><div id="templateOptions" role="group" aria-label="Templates"></div></div>
  </details><select id="template" hidden aria-label="Layout"></select>
  <div class="nav-field country-choice"><span>Country</span><details id="countryPicker" class="preset-picker"><summary id="countryLabel">All countries</summary><div class="template-popup"><input id="countrySearch" type="search" placeholder="Search countries" aria-label="Search countries"><div id="countryOptions" class="picker-options"></div></div></details><select id="presetCountry" hidden><option value="">All countries</option></select></div>
  <div class="nav-field player-choice"><span>Player</span><details id="playerPicker" class="preset-picker"><summary id="playerLabel">Choose player</summary><div class="template-popup"><input id="playerSearch" type="search" placeholder="Search players" aria-label="Search players"><div id="playerOptions" class="picker-options"></div></div></details><select id="presetPlayer" hidden><option value="">Choose player</option></select></div>
  <button id="newPlayer" title="New template draft" aria-label="New template draft">+</button>
  <button id="savePreset" class="primary">Save template</button>
  <button id="deletePreset" title="Delete selected saved template" disabled>Delete saved</button>
  <span id="libraryStatus" class="status" role="status" aria-live="polite">Library connecting...</span>
 </div>
 <div class="header-operations">
  <div class="header-group" role="group" aria-label="Operator controls">
    <label class="operator-field"><span>Operator</span><input id="operatorName" class="operator-name" maxlength="40" aria-label="Operator name" title="Operator name"></label>
    <button id="usersButton">Users: 0</button><span id="accessRole" class="status"></span>
  </div>
  <div class="header-group" role="group" aria-label="Export and reset">
    <button id="mp4Button">Export MP4</button><button id="pngButton">Export PNG</button>
    <button id="reset">Reset template</button>
  </div>
  <div class="header-group header-live" role="group" aria-label="Live output controls">
  <span id="liveStatus" class="status">Stopped</span>
  <button id="liveButton" class="signal-red">Start live stream</button>
  <button id="takeLive" class="signal-yellow" disabled>Push On Air</button>
  <button id="clearLive" disabled title="Clear the graphic while keeping output running">Clear On Air</button>
  </div>
 </div>
</header>
<main class="app">
  <aside class="controls"><div id="error" class="error"></div><div id="editor"></div></aside>
  <section class="preview-pane">
    <div class="preview-head"><span id="presetState">Preview</span><div><button id="undo" title="Undo" aria-label="Undo">&#8630;</button><button id="redo" title="Redo" aria-label="Redo">&#8631;</button> <span id="dimensions" class="status"></span></div></div>
    <div class="preview-tools">
      <select id="previewLayer" aria-label="Selected image" title="Selected image"></select>
      <button id="moveLeft" class="tool-button" title="Move left" aria-label="Move left">&#8592;</button>
      <button id="moveUp" class="tool-button" title="Move up" aria-label="Move up">&#8593;</button>
      <button id="moveDown" class="tool-button" title="Move down" aria-label="Move down">&#8595;</button>
      <button id="moveRight" class="tool-button" title="Move right" aria-label="Move right">&#8594;</button>
      <button id="shrinkImage" class="tool-button" title="Make image smaller" aria-label="Make image smaller">&#8722;</button>
      <input id="previewScale" type="range" min="2" max="300" step="1" aria-label="Image size">
      <button id="growImage" class="tool-button" title="Make image larger" aria-label="Make image larger">+</button>
      <span id="previewScaleValue" class="status"></span>
    </div>
    <div id="stage" class="stage" tabindex="0"><img id="preview" alt="Scoreboard preview"></div>
  </section>
  <section class="program-pane" aria-label="On Air monitor">
    <div class="program-head"><strong>ON AIR</strong><span id="programState" role="status">Output stopped</span></div>
    <div id="programName">Black</div>
    <div class="program-screen"><img id="programImage" alt="Server output preview" title="Software output frame; not an SDI hardware return feed"><span id="programUnavailable">Connecting...</span></div>
    <div id="programDetails" class="status"></div>
    <div id="programUpdated" class="status"></div>
  </section>
</main>
<style>
.app{grid-template-columns:minmax(330px,26%) minmax(0,1fr) minmax(0,1fr)}
.program-pane{min-width:0;padding:10px;border-left:1px solid var(--line);background:#f5f8fa}
.program-head{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:34px;flex-wrap:wrap}.program-head strong{color:#b52c34;font-size:14px}.program-head span{font-size:12px;padding:4px 8px;background:#e4e9ed;color:#344752}
.program-head span.on-air{background:#d9f0e2;color:#10643b}.program-head span.stale{background:#ffe4cb;color:#852b13}
#programName{font-weight:600;overflow-wrap:anywhere;padding:6px 0;min-height:30px}.program-screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}.program-screen img{width:100%;height:100%;object-fit:contain;display:block}#programUnavailable{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000d;color:#fff;font-size:13px;text-align:center;padding:12px}#programUnavailable[hidden]{display:none}#programDetails,#programUpdated{margin-top:8px;overflow-wrap:anywhere}
.preview-head{height:auto;min-height:34px;gap:8px;flex-wrap:wrap}.preview-head>div{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.preview-tools{grid-template-columns:minmax(100px,1fr) repeat(5,34px)}.preview-tools input[type=range]{grid-column:1/5;grid-row:2}.stage{flex:none;width:100%;aspect-ratio:16/9;padding:8px;overflow:hidden}.preview-pane{min-height:0;overflow:auto}.stage img{width:100%;height:100%;object-fit:contain}
@media(min-width:901px) and (max-width:1200px){.app{grid-template-columns:minmax(330px,38%) minmax(0,1fr);height:auto}.controls{grid-column:1;grid-row:1/3}.preview-pane{grid-column:2;grid-row:1;height:auto;min-height:0}.program-pane{grid-column:2;grid-row:2}.toolbar{height:auto;flex-wrap:wrap}}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr);height:auto}.program-pane{grid-column:1;grid-row:1;border-left:0}.preview-pane{grid-column:1;grid-row:2;height:auto;min-height:0}.controls{grid-column:1;grid-row:3}.preview-tools{grid-template-columns:minmax(100px,1fr) repeat(5,34px)}.toolbar{display:flex;flex-wrap:wrap}.toolbar button{width:auto}.toolbar .template-picker{flex:1;min-width:180px}.stage{height:auto;min-height:0}}
</style>

<style>
.toolbar{display:flex;flex-direction:column;align-items:stretch;height:auto;gap:0;padding:0;position:sticky;top:0}

.toolbar .operator-name{width:145px;min-width:0}.toolbar button{white-space:nowrap;flex-shrink:0;width:auto}
#accessRole{font-size:11px} .app{height:calc(100dvh - var(--header-height,130px))}

 let choices=null;if(key==='canvas_size')choices=boot.canvas_sizes[template];else if(key==='panel_side')choices=['right','left'];else if(key==='panel_style')choices=['solid','gradient','glass'];else if(key.endsWith('_align'))choices=['left','center','right'];
 if(choices)control=`<select data-scalar="${key}">${choices.map(x=>option(x,x,value)).join('')}</select>`;
 else if(['title','headline','subject'].includes(key))control=`<textarea data-scalar="${key}">${esc(value)}</textarea>`;
 else if(key==='overlay_opacity_pct')control=`<input data-scalar="${key}" type="number" min="0" max="100" step="1" value="${esc(value??100)}">`;

 return `<div class="field"><label>${esc(label)}</label>${control}</div>`;

async function uploadImageFile(file,key){
 if(!file||!file.type.startsWith('image/'))throw new Error('Drop or choose a supported image file.');

 uploadBusy=true;syncProjectLock();document.body.classList.add('busy');
 try{const data=await fileData(file),res=await apiJson('/api/upload',{name:file.name,data});setImagePath(key,res.path);selectedLayer[template]=key.startsWith('player.')?`player_${key.split('.')[1]}`:key;markChanged(true)}
 finally{uploadBusy=false;document.body.classList.remove('busy');syncProjectLock()}
}

 document.querySelectorAll('[data-scalar]').forEach(el=>{const update=()=>{const key=el.dataset.scalar,val=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;if(key.includes('.')){const [base,index]=key.split('.');getConfig()[base][+index]=val}else getConfig()[key]=val};el.onchange=()=>{update();markChanged()};if(el.matches('input[type=text],textarea'))el.oninput=()=>{update();scheduleRender()}});

function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read image'));r.readAsDataURL(file)})}
async function apiJson(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,client_id:clientId})});let value;try{value=await r.json()}catch{value={error:`HTTP ${r.status}`}}if(!r.ok)throw new Error(value.error||`HTTP ${r.status}`);return value}
function request(){return {client_id:clientId,template,config:getConfig(),update_live:false}}
function scheduleRender(save=true){const key=JSON.stringify({template,config:getConfig()});if(key===scheduledPreview){syncProjectLock();return}scheduledPreview=key;++renderToken;previewReady=false;$('stage').setAttribute('aria-busy','true');$('dimensions').textContent='Rendering...';syncProjectLock();syncMediaPreview();layoutTextBoxes();clearTimeout(renderTimer);renderTimer=setTimeout(renderNow,save?90:0)}
async function renderNow(){
 const token=++renderToken,renderedTemplate=template;let url;
 try{
  setError();
  const r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request())});
  if(!r.ok){const x=await r.json();throw new Error(x.error||`HTTP ${r.status}`)}
  const blob=await r.blob();if(token!==renderToken)return;
  // Decode off-screen: never clear or revoke the frame an operator is editing against.
  url=URL.createObjectURL(blob);const nextFrame=new Image();nextFrame.src=url;await nextFrame.decode();
  if(token!==renderToken){URL.revokeObjectURL(url);return}
  await renderCustomOverlay(token);
  if(token!==renderToken){URL.revokeObjectURL(url);return}
  const previousUrl=previewUrl;$('preview').src=url;previewUrl=url;
  if(previousUrl)URL.revokeObjectURL(previousUrl);
  previewReady=true;$('preview').dataset.template=renderedTemplate;$('stage').setAttribute('aria-busy','false');
  $('dimensions').textContent=`${nextFrame.naturalWidth.toLocaleString()} × ${nextFrame.naturalHeight.toLocaleString()} px`;
  layoutTextBoxes();updateLiveButtons();
 }catch(e){
  if(url&&url!==previewUrl)URL.revokeObjectURL(url);
  if(token===renderToken){scheduledPreview='';$('stage').setAttribute('aria-busy','false');$('dimensions').textContent=previewUrl?'Update failed - previous preview':'Preview unavailable';setError(e.message);updateLiveButtons()}
 }
}

function downloadJson(value,name){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

async function refreshUsers(){

  $('usersAccess').textContent=data.can_manage?'Priority control available on this computer':'Priority control is managed from the host computer';
  $('accessRole').textContent=data.can_manage?'Host control':'LAN operator';updateLiveButtons();
  $('usersTable').innerHTML=data.sessions.map(s=>{
   const live=s.live_owner?(data.can_manage?'<button data-admin-stop-live>Stop</button>':'LIVE'):'';
   const priority=data.can_manage?`<select data-user-priority="${esc(s.id)}"><option value="0"${s.priority===0?' selected':''}>Viewer</option><option value="50"${s.priority>0&&s.priority<100?' selected':''}>Operator</option><option value="100"${s.priority===100?' selected':''}>Primary</option></select>`:esc(`${priorityName(s.priority)} (${s.priority})`);
   return `<tr><td>${esc(s.name)}${s.id===clientId?' (you)':''}</td><td>${esc(s.address)}</td><td>${s.age_seconds}s</td><td>${priority}</td><td>${live}</td></tr>`;
  }).join('');
  document.querySelectorAll('[data-user-priority]').forEach(select=>select.onchange=async()=>{try{await apiJson('/api/session/priority',{target_id:select.dataset.userPriority,priority:+select.value});await refreshUsers();await refreshLive()}catch(e){setError(e.message)}});
  document.querySelectorAll('[data-admin-stop-live]').forEach(button=>button.onclick=async()=>{if(!confirm('Stop the current SDI output? This interrupts the live stream.'))return;try{button.disabled=true;await liveCommand('/api/live/stop',{expected_revision:latestLive.program_revision});await refreshUsers()}catch(e){setError(e.message)}});
 }catch(e){setError(e.message)}
}

function programUnavailable(message){programReady=false;$('programUnavailable').hidden=false;$('programUnavailable').textContent=message;$('programState').className='stale';updateLiveButtons()}
async function refreshProgram(){if(!boot?.program_monitor){programUnavailable('Output monitor pending server restart');return}if(programFetchBusy)return;programFetchBusy=true;try{if(displayedProgramRevision!==latestLive.program_revision)programUnavailable('Updating output...');const response=await fetch('/api/live/preview',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!response.ok)throw Error('Output preview unavailable');const revision=response.headers.get('X-Program-Revision'),blob=await response.blob();if(revision!==latestLive.program_revision)return;const url=URL.createObjectURL(blob);$('programImage').src=url;await $('programImage').decode();if(programUrl)URL.revokeObjectURL(programUrl);programUrl=url;if(revision!==latestLive.program_revision)return;displayedProgramRevision=revision;programReady=true;$('programUnavailable').hidden=true;$('programState').className=latestLive.on_air?'on-air':'';$('programUpdated').textContent='Updated '+new Date().toLocaleTimeString();updateLiveButtons()}catch(error){programUnavailable('Preview unavailable - last frame is not current');$('programUpdated').textContent='Connection interrupted'}finally{programFetchBusy=false}}
async function refreshLive(){if(liveRefreshBusy)return;liveRefreshBusy=true;try{const r=await fetch('/api/live/status?client_id='+encodeURIComponent(clientId),{signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('Live status unavailable');latestLive=await r.json();$('liveStatus').textContent=latestLive.active?(latestLive.on_air?'On Air':(latestLive.clear_mode==='external-key'?'Transparent / Output running':latestLive.clear_mode==='black'?'Black / Output running':latestLive.clear_mode==='chroma-magenta'?'Magenta / Output running':'Chroma clear / Output running')):'Output stopped';$('programState').textContent=$('liveStatus').textContent;$('programName').textContent=latestLive.on_air?(latestLive.program_name||'Live graphic'):(latestLive.clear_mode==='external-key'?'Transparent':latestLive.clear_mode==='chroma-magenta'?'Magenta':latestLive.clear_mode&&latestLive.clear_mode!=='black'?'Chroma clear - switcher composite not monitored':'Black');$('programDetails').textContent=latestLive.active?[latestLive.program_layout==='overlay'?'Overlay':latestLive.program_layout==='full-picture'?'Full picture':'',latestLive.clear_mode==='external-key'?boot.decklink_key_pairs[latestLive.output]:latestLive.output,latestLive.preset,latestLive.owner_name,latestLive.media_finished?'Last frame held':''].filter(Boolean).join(' | '):'';updateLiveButtons();if(latestLive.error||latestLive.media_error)setError(latestLive.error||latestLive.media_error);await refreshProgram()}catch(error){latestLive={active:false};$('liveStatus').textContent='Connection lost';$('programState').textContent='Status unknown';programUnavailable('Connection lost - output status unknown');setError(error.message)}finally{liveRefreshBusy=false}}
async function init(){try{$('operatorName').value=localStorage.getItem('vetoScoreboardOperatorName')||`Operator ${clientId.slice(0,4).toUpperCase()}`;await registerSession();boot=await (await fetch('/api/bootstrap')).json();if(!boot.template_library)throw Error('Server update pending. Restart required.');configs=clone(boot.defaults);try{const saved=JSON.parse(localStorage.getItem('vetoScoreboardWeb')||'null');if(saved?.configs){configs={...configs,...saved.configs};template=saved.template in configs?saved.template:'t1'}}catch{}for(const key of ['t5','t11'])configs[key]={...boot.defaults[key],...configs[key]};Object.entries(boot.template_names).forEach(([k,v])=>$('template').insertAdjacentHTML('beforeend',option(k,v,template)));boot.video_presets.forEach(v=>{$('livePreset').insertAdjacentHTML('beforeend',option(v,v,v==='HD 1080i50'))});(boot.mp4_presets||boot.video_presets).forEach(v=>$('mp4Preset').insertAdjacentHTML('beforeend',option(v,v,v==='HD 1080i50')));Object.keys(boot.decklink_outputs).forEach(v=>$('liveDevice').insertAdjacentHTML('beforeend',option(v,v,false)));for(const cfg of Object.values(configs)){if(!Object.values(boot.canvas_sizes).flat().includes(cfg.canvas_size))cfg.canvas_size='HD  (1920x1080)'}history=[clone(configs)];historyIndex=0;buildEditor();syncHistory();scheduleRender(false);await refreshLive();await refreshUsers();setInterval(refreshLive,1500);setInterval(async()=>{try{await apiJson('/api/session/heartbeat',{});await refreshUsers()}catch{}},5000)}catch(e){setError(e.message)}}
$('template').onchange=()=>switchTemplate($('template').value);$('undo').onclick=()=>restore(historyIndex-1);$('redo').onclick=()=>restore(historyIndex+1);$('reset').onclick=()=>{if(presetSaving||!confirm('Reset this template draft?'))return;configs[template]=clone(boot.defaults[template]);commit();buildEditor();scheduleRender()};
$('pngButton').onclick=async()=>{try{await download('/api/export/png',request(),`scoreboard_${template}.png`)}catch(e){setError(e.message)}};$('mp4Button').onclick=()=>$('mp4Dialog').showModal();$('exportMp4').onclick=async()=>{try{$('exportMp4').disabled=true;await download('/api/export/mp4',{...request(),preset:$('mp4Preset').value,duration:+$('mp4Duration').value},`scoreboard_${template}.mp4`);$('mp4Dialog').close()}catch(e){setError(e.message)}finally{$('exportMp4').disabled=false}};
$('operatorName').onchange=async()=>{try{await registerSession();await refreshUsers();await refreshLive()}catch(e){setError(e.message)}};$('usersButton').onclick=async()=>{$('usersDialog').showModal();await refreshUsers()};$('refreshUsers').onclick=refreshUsers;
async function liveCommand(path,payload){if(liveCommandBusy)return;liveCommandBusy=true;updateLiveButtons();try{const result=await apiJson(path,payload);latestLive=result;programReady=false;return result}finally{liveCommandBusy=false;await refreshLive();updateLiveButtons()}}
function outputStartReady(){
 $('startLive').disabled=liveCommandBusy||!$('receiverConfirmed').checked||!$('livePreset').value||!$('liveDevice').value||($('clearMode').value!=='black'&&!$('keyerConfirmed').checked);
}
function chooseOutputModes(){
 const mode=$('clearMode').value,external=mode==='external-key',magenta=mode==='chroma-magenta',fixedFormat=external||magenta;
 $('livePreset').innerHTML=(fixedFormat?['HD 1080i50']:boot.video_presets).map(v=>option(v,v,'HD 1080i50')).join('');
 $('livePreset').disabled=fixedFormat;$('receiverConfirmed').checked=false;$('receiverConfirmed').disabled=false;$('keyerConfirmed').checked=false;
 $('keyerConfirmation').hidden=$('clearMode').value==='black';
 $('keyerConfirmationText').textContent=external?'Fill and Key cables match this pair; switcher external key is configured':magenta?'Switcher chroma key is set to magenta / pink; matching graphic colours will also be removed':'Switcher chroma key matches this colour; matching graphic colours will also be removed';
 $('outputHardwareStatus').textContent=external?(boot.decklink_key_pairs[$('liveDevice').value]+' | 1080i50'):magenta?('SDI '+[1,3,2,4][boot.decklink_outputs[$('liveDevice').value]]+' | Magenta #FF00FF | 1080i50'):'';
 outputStartReady();
}
function configureOutputChoices(){
 const previous=$('liveDevice').value,external=$('clearMode').value==='external-key',outputs=external?boot.decklink_key_pairs:boot.decklink_outputs;
 $('liveDevice').innerHTML=Object.keys(outputs).map(name=>option(name,external?'Device '+boot.decklink_outputs[name]+': '+outputs[name]:name,previous)).join('');
 $('liveDevice').disabled=false;chooseOutputModes();
}
function openOutputDialog(){
 const lastMode=latestLive.clear_mode;
 $('clearMode').value=['external-key','chroma-magenta'].includes(lastMode)?lastMode:'external-key';
 configureOutputChoices();
 if(!$('liveDialog').open)$('liveDialog').showModal();
}
$('clearMode').onchange=configureOutputChoices;
$('liveDevice').onchange=chooseOutputModes;
$('livePreset').onchange=()=>{$('receiverConfirmed').checked=false;outputStartReady()};
$('receiverConfirmed').onchange=outputStartReady;
$('keyerConfirmed').onchange=outputStartReady;
$('liveButton').onclick=async()=>{if(latestLive.active){if(!latestLive.owned_by_requester&&!latestSessions.can_manage)return;if(!confirm('Stop SDI output controlled by '+(latestLive.owner_name||'the live operator')+'? The live stream will stop. Clear On Air keeps output running in the selected clear mode.'))return;try{await liveCommand('/api/live/stop',{expected_revision:latestLive.program_revision});await refreshUsers()}catch(e){setError(e.message)}}else await openOutputDialog()};$('startLive').onclick=async()=>{if(!$('receiverConfirmed').checked)return;if($('clearMode').value!=='black'&&!$('keyerConfirmed').checked){setError('Confirm the switcher key setup first.');return;}try{$('startLive').disabled=true;await liveCommand('/api/live/start',{...request(),preset:$('livePreset').value,output:$('liveDevice').value,clear_mode:$('clearMode').value,keyer_confirmed:$('keyerConfirmed').checked});$('liveDialog').close();await refreshUsers()}catch(e){setError(e.message)}finally{outputStartReady()}};
$('takeLive').onclick=async()=>{const snapshot=JSON.stringify({template,config:getConfig()}),name=library.find(p=>p.id===selectedSaved)?.player||boot.template_names[template];try{const result=await liveCommand('/api/live/show',{...request(),name,expected_revision:latestLive.program_revision});if(!result)return;lastShown=snapshot;shownRevision=result.on_air;updateLiveButtons()}catch(error){setError(error.message)}};
$('clearLive').onclick=async()=>{if(!confirm('Clear On Air to '+(latestLive.clear_mode==='external-key'?'transparent':latestLive.clear_mode==='black'?'black':latestLive.clear_mode==='chroma-magenta'?'magenta':'chroma')+'? Output stays running; your preview and saved templates are kept.'))return;try{await liveCommand('/api/live/clear',{expected_revision:latestLive.program_revision});lastShown=null;shownRevision=null;updateLiveButtons()}catch(error){setError(error.message)}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(b.dataset.close==='presetDialog'&&presetSaving)return;$(b.dataset.close).close()});window.addEventListener('beforeunload',event=>{if(boot&&hasUnsavedChanges()){event.preventDefault();event.returnValue=''}});init().then(()=>{cleanDrafts=clone(configs);renderTemplateOptions();refreshLibrary();watchLibrary()});setInterval(()=>{if(boot)refreshLibrary()},30000);
</script>
</body>
</html>
