worker_processes 1;

error_log logs/live_dashboard_error.log warn;
pid logs/live_dashboard.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log logs/live_dashboard_access.log;
    sendfile on;
    keepalive_timeout 30;

    client_body_temp_path temp/live_client_body;
    proxy_temp_path temp/live_proxy;

    server {
        listen 0.0.0.0:8090;
        server_name _;

        allow 127.0.0.1;
        allow 192.168.50.0/24;
        allow 192.168.55.0/24;
        allow 192.168.56.0/24;
        deny all;

        auth_basic "Veto Live Dashboard";
        auth_basic_user_file live_dashboard.htpasswd;

        location = /healthz {
            auth_basic off;
            proxy_pass http://127.0.0.1:8790/healthz;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = / {
            return 302 /war-room;
        }

        location / {
            proxy_pass http://127.0.0.1:8790;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    server {
        listen 0.0.0.0:8070;
        server_name _;

        allow 127.0.0.1;
        allow 192.168.3.34;
        allow 192.168.50.0/24;
        allow 192.168.55.0/24;
        allow 192.168.56.0/24;
        deny all;

        auth_basic "Veto Live Dashboard";
        auth_basic_user_file live_dashboard.htpasswd;

        location = / {
            proxy_pass http://127.0.0.1:8810/recorder;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8810;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        # Do not expose the recorder's source, database, or log directories.
        location / {
            return 404;
        }
    }
}
