<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 380px; font: 13px system-ui, sans-serif; margin: 0; padding: 12px; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  textarea { width: 100%; height: 140px; box-sizing: border-box; font: 12px monospace; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  input[type=number], input[type=text] { padding: 4px; }
  button { padding: 6px 12px; cursor: pointer; }
  #start { flex: 1; background: #10a37f; color: #fff; border: 0; border-radius: 4px; font-weight: 600; }
  #stop { background: #d9534f; color: #fff; border: 0; border-radius: 4px; }
  #status { margin-top: 10px; padding: 8px; background: #f4f4f4; border-radius: 4px;
            white-space: pre-wrap; word-break: break-word; min-height: 18px; font-size: 12px; }
  label { font-size: 12px; color: #444; }
  .hint { color: #888; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
  <h3>ChatGPT Prompt Queue</h3>
  <textarea id="prompts" placeholder="One prompt per line&#10;&#10;or click Load CSV to pick a file"></textarea>

  <div class="row">
    <button id="load">Load CSV</button>
    <input type="file" id="file" accept=".csv,.txt" style="display:none">
    <button id="reset">Reset progress</button>
  </div>

  <div class="row">
    <label>Delay (s)</label>
    <input type="number" id="delay" value="5" min="1" max="120" style="width:60px">
    <label>Folder</label>
    <input type="text" id="folder" value="chatgpt-batch" style="width:130px">
  </div>

  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>

  <div id="status">Idle.</div>
  <div class="hint">Open your ChatGPT tab first, then hit Start. Resumes automatically if interrupted.</div>

  <script src="popup.js"></script>
</body>
</html>
